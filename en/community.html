<script>
const hamburger = document.getElementById('hamburger');
const navMenu = document.getElementById('navMenu');
const hamburgerIcon = document.getElementById('hamburger-icon');

hamburger.addEventListener('click', () => {
  if (navMenu.classList.contains('show')) {
    // 閉じる処理
    navMenu.classList.remove('visible');
    setTimeout(() => {
      navMenu.classList.remove('animate-bg');
      setTimeout(() => {
        navMenu.classList.remove('show');
      }, 1000);
    }, 300);
    hamburgerIcon.src = '../img/hamburger.png';
  } else {
    // 開く処理
    navMenu.classList.add('show');
    setTimeout(() => navMenu.classList.add('animate-bg'), 50);
    setTimeout(() => {
      navMenu.classList.add('visible');
      hamburgerIcon.src = '../img/close-hamburger.png';
    }, 1800);
  }
});
</script>
<script>
const pageTop = document.getElementById("pageTop");
const footer = document.getElementById("footer");
const nav = document.querySelector(".nav");

const gap = 100; // footer との余白

window.addEventListener("scroll", () => {
  const scrollY = window.scrollY;
  const windowH = window.innerHeight;
  const footerTop = footer.offsetTop;
  const navHeight = nav.offsetHeight;

  /* ===== nav が画面外に出たら表示 ===== */
  if (scrollY > navHeight) {
    pageTop.classList.add("is-visible");
  } else {
    pageTop.classList.remove("is-visible");
  }

  /* ===== footer 手前で止める ===== */
  if (scrollY + windowH >= footerTop) {
    pageTop.classList.add("is-stop");
    pageTop.style.top =
      footerTop - pageTop.offsetHeight - gap + "px";
  } else {
    pageTop.classList.remove("is-stop");
    pageTop.style.top = "auto";
  }
});
</script>

<script>
const pageTopBtn = document.getElementById("pageTop");
const bomImg = document.getElementById("bomImg");

let isClicked = false;

// hover → bom2
pageTopBtn.addEventListener("mouseenter", () => {
  if (!isClicked) bomImg.src = "../img/bom2.png";
});

// leave → bom1
pageTopBtn.addEventListener("mouseleave", () => {
  if (!isClicked) bomImg.src = "../img/bom1.png";
});

// click → bom3
pageTopBtn.addEventListener("click", () => {
  isClicked = true;
  bomImg.src = "../img/bom3.png";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

// 上に戻ったら bom1 に戻す
window.addEventListener("scroll", () => {
  if (window.scrollY === 0) {
    isClicked = false;
    bomImg.src = "../img/bom1.png";
  }
});
</script>
